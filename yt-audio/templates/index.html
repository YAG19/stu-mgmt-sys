<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube to Audio</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1d2129; --muted:#667085; --accent:#e5322d; --border:#d0d5dd; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111317; --card:#1b1e24; --text:#eceef2; --muted:#9aa1ad; --border:#343a44; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
           font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
    main { width:100%; max-width:560px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px; }
    h1 { margin:0 0 4px; font-size:1.5rem; }
    p.sub { margin:0 0 20px; color:var(--muted); }
    label { display:block; font-weight:600; margin:14px 0 6px; }
    input, select, button { width:100%; font:inherit; padding:11px 12px; border-radius:9px; border:1px solid var(--border);
                            background:var(--bg); color:var(--text); }
    button { margin-top:20px; background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:progress; }
    #status { margin-top:16px; min-height:1.5em; color:var(--muted); }
    #status.error { color:var(--accent); }
    small { color:var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>YouTube → Audio</h1>
  <p class="sub">Paste a YouTube link and download it as a high-quality audio file.</p>
  <form id="form">
    <label for="url">YouTube link</label>
    <input id="url" name="url" type="url" required placeholder="https://www.youtube.com/watch?v=...">

    <label for="format">Format</label>
    <select id="format" name="format">
      <option value="mp3">MP3 — 320 kbps (plays everywhere)</option>
      <option value="m4a">M4A / AAC — 256 kbps</option>
      <option value="opus">Opus — 192 kbps</option>
      <option value="flac">FLAC — lossless container</option>
      <option value="wav">WAV — uncompressed</option>
      <option value="original">Original stream — no re-encoding (best fidelity)</option>
    </select>
    <small>YouTube's source audio is lossy. "Original" keeps it untouched; other formats re-encode at high settings.</small>

    <button id="go" type="submit">Convert &amp; download</button>
  </form>
  <div id="status" role="status"></div>
</main>
<script>
  const form = document.getElementById('form');
  const btn = document.getElementById('go');
  const status = document.getElementById('status');

  function setStatus(msg, isError) {
    status.textContent = msg;
    status.className = isError ? 'error' : '';
  }

  function filenameFrom(header) {
    if (!header) return 'audio';
    const star = header.match(/filename\*=UTF-8''([^;]+)/i);
    if (star) return decodeURIComponent(star[1]);
    const plain = header.match(/filename="?([^";]+)"?/i);
    return plain ? plain[1] : 'audio';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    setStatus('Downloading and converting… this can take a minute for long videos.');
    try {
      const res = await fetch('/api/convert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: form.url.value, format: form.format.value }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `Request failed (${res.status})`);
      }
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filenameFrom(res.headers.get('Content-Disposition'));
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
      setStatus(`Done: ${a.download}`);
    } catch (err) {
      setStatus(err.message, true);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
